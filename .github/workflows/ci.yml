name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm supabase start -x studio,imgproxy,vector,logflare,edge-runtime
      - run: pnpm db:test

  e2e:
    runs-on: ubuntu-latest
    needs: [checks]
    env:
      APP_ENV: demo
      NEXT_PUBLIC_APP_ENV: demo
      WEB_BASE_URL: http://localhost:3000
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "54325"
      SMTP_FROM: "Finance Tracker <no-reply@example.com>"
      OWNER_EMAIL: owner@example.com
      ANDROID_APP_ID: com.example.financetracker.demo
      ANDROID_CERT_SHA256: "00:00"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm supabase start -x studio,imgproxy,vector,logflare,edge-runtime
      - name: Export local Supabase keys
        run: |
          pnpm supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY >> "$GITHUB_ENV"
      - run: pnpm --filter @ft/web test:int
      - run: pnpm --filter @ft/web exec playwright install --with-deps chromium
      - run: pnpm e2e
